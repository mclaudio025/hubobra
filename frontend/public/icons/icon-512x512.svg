<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Construction Building / Hexagon Icon Symbol -->
  <g filter="url(#shadow)" transform="translate(60, 60)">
    <!-- Roof / Arrow Top -->
    <path d="M 196 40 L 330 140 L 62 140 Z" fill="url(#grad1)"/>
    
    <!-- Building Left Block -->
    <rect x="76" y="156" width="100" height="180" rx="16" fill="url(#grad1)"/>
    
    <!-- Building Right Block -->
    <rect x="216" y="156" width="100" height="180" rx="16" fill="url(#grad2)"/>
    
    <!-- Center Construction Hammer / Modern Beam -->
    <rect x="136" y="196" width="120" height="32" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="180" y="196" width="32" height="140" rx="8" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
    HUB<tspan fill="#f97316">OBRA</tspan>
  </text>
</svg>
