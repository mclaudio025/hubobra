name: hub_scanner
description: "HubScanner - Aplicativo Coletor e Scanner Inteligente de Estoque e Preços conectado ao Supabase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Backend & Realtime
  supabase_flutter: ^2.8.0

  # Hardware-accelerated Barcode Scanner
  mobile_scanner: ^6.0.2

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # Image Caching & Networking
  cached_network_image: ^3.4.1
  http: ^1.2.2

  # Internationalization (R$ formatting) & Local Storage
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
